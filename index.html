<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abo Al-Yusr Grills | مشويات أبو اليسر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #e67e22;
            --text-light: #f5f5f5;
            --text-gray: #aaa;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; }
        
        /* Header */
        header { background: linear-gradient(135deg, #111, #2c3e50); text-align: center; padding: 25px 15px; border-bottom: 3px solid var(--accent-gold); }
        header h1 { margin: 0; color: var(--accent-gold); font-size: 28px; font-weight: 900; }
        header p { margin: 5px 0 0; color: var(--text-gray); }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }

        /* Categories Bar */
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .cat-btn { background: var(--card-bg); color: var(--text-light); border: 1px solid #333; padding: 10px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn.active { background: var(--accent-gold); border-color: var(--accent-gold); }

        /* Menu Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { margin: 0 0 8px; color: #fff; font-size: 18px; }
        .card .price { color: var(--accent-gold); font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        
        select, input, textarea { width: 100%; background: #2b2b2b; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        select:focus, input:focus { outline: none; border-color: var(--accent-gold); }

        .btn-add { background: var(--accent-gold); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-add:hover { background: #d35400; }

        /* Cart Box */
        .cart-box { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-top: 30px; border: 2px solid var(--accent-gold); }
        .cart-box h2 { margin-top: 0; color: var(--accent-gold); }
        .cart-item { display: flex; justify-content: space-between; background: #2b2b2b; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .cart-total { font-size: 20px; font-weight: bold; text-align: left; margin: 15px 0; color: #2ecc71; }
    </style>
</head>
<body>

    <header>
        <h1>Abo Al-Yusr Grills | مشويات أبو اليسر</h1>
        <p>أصل المشويات البلدي والطعم الأصيل</p>
    </header>

    <div class="container">
        <h2>قائمة الطعام</h2>
        <div class="grid">
            <div class="card">
                <div>
                    <h3>كفتة كندوز فاخرة</h3>
                    <div class="price" id="p1">350 ج.م / كيلو</div>
                    <select id="w1" onchange="updateCardPrice(1, 350)">
                        <option value="1 كيلو" data-multiplier="1">1 كيلو - 350 ج.م</option>
                        <option value="نصف كيلو" data-multiplier="0.5">نصف كيلو - 175 ج.م</option>
                        <option value="ربع كيلو" data-multiplier="0.25">ربع كيلو - 88 ج.م</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addToCart('كفتة كندوز', 'w1', 350)">إضافة للسلة</button>
            </div>

            <div class="card">
                <div>
                    <h3>طرب ضاني محشي</h3>
                    <div class="price" id="p2">400 ج.م / كيلو</div>
                    <select id="w2" onchange="updateCardPrice(2, 400)">
                        <option value="1 كيلو" data-multiplier="1">1 كيلو - 400 ج.م</option>
                        <option value="نصف كيلو" data-multiplier="0.5">نصف كيلو - 200 ج.م</option>
                        <option value="ربع كيلو" data-multiplier="0.25">ربع كيلو - 100 ج.م</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addToCart('طرب ضاني', 'w2', 400)">إضافة للسلة</button>
            </div>

            <div class="card">
                <div>
                    <h3>فراخ مشوية على الفحم</h3>
                    <div class="price" id="p3">200 ج.م / فرخة</div>
                    <select id="w3" onchange="updateCardPrice(3, 200)">
                        <option value="فرخة كاملة" data-multiplier="1">فرخة كاملة - 200 ج.م</option>
                        <option value="نصف فرخة" data-multiplier="0.5">نصف فرخة - 100 ج.م</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addToCart('فرخة مشوية', 'w3', 200)">إضافة للسلة</button>
            </div>
        </div>

        <div class="cart-box">
            <h2>سلة الطلب الخاص بك</h2>
            <div id="cartItems">لا يوجد أطباق في السلة بعد.</div>
            <div class="cart-total" id="totalPrice">الإجمالي: 0 ج.م</div>

            <hr style="border-color:#333; margin:20px 0;">

            <h3>بيانات التوصيل</h3>
            <input type="text" id="custName" placeholder="الاسم بالكامل" required>
            <input type="tel" id="custPhone" placeholder="رقم الموبايل" required>
            <input type="text" id="custAddress" placeholder="العنوان بالتفصيل (الشارع - الدور - الشقة)" required>
            <textarea id="custNotes" rows="2" placeholder="ملاحظات الطلب (مثال: تسوية زيادة، طحينة زيادة)"></textarea>

            <button class="btn-add" style="font-size:18px; padding:15px;" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkC49sNa7C8rLDL9haYgmRBBtI5_myZKk",
            authDomain: "abo-e-51c20.firebaseapp.com",
            projectId: "abo-e-51c20",
            storageBucket: "abo-e-51c20.firebasestorage.app",
            messagingSenderId: "157176150148",
            appId: "1:157176150148:web:81afd058081d828f03ead1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = [];

        function addToCart(itemName, selectId, basePrice) {
            const select = document.getElementById(selectId);
            const size = select.value;
            const mult = parseFloat(select.options[select.selectedIndex].dataset.multiplier);
            const price = basePrice * mult;

            cart.push({ item: itemName, size: size, price: price });
            renderCart();
        }

        function renderCart() {
            const div = document.getElementById('cartItems');
            if(cart.length === 0) {
                div.innerHTML = 'لا يوجد أطباق في السلة بعد.';
                document.getElementById('totalPrice').innerText = 'الإجمالي: 0 ج.م';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((c, index) => {
                total += c.price;
                html += `
                    <div class="cart-item">
                        <span>${c.item} (${c.size})</span>
                        <span><b>${c.price} ج.م</b> <button style="background:red;color:white;border:none;border-radius:3px;cursor:pointer;" onclick="removeItem(${index})">X</button></span>
                    </div>
                `;
            });
            div.innerHTML = html;
            document.getElementById('totalPrice').innerText = `الإجمالي: ${total} ج.م`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const notes = document.getElementById('custNotes').value.trim();

            if(!name || !phone || !address || cart.length === 0) {
                alert('برجاء كتابة الاسم، الهاتف، العنوان، وإضافة صنف واحد على الأقل للسلة!');
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);

            db.collection("orders").add({
                customer: name,
                phone: phone,
                address: address,
                notes: notes,
                items: cart,
                total: totalAmount,
                status: "جديد",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تم إرسال طلبك لمشويات أبو اليسر بنجاح! جاري تحضير طلبك.");
                cart = [];
                renderCart();
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custAddress').value = '';
                document.getElementById('custNotes').value = '';
            }).catch(err => {
                alert("حدث خطأ أثناء الإرسال: " + err.message);
            });
        }
    </script>
</body>
</html>
